<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>S T A R B L O O D</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --blood-glow: #ff3333;
            --blood-dark: #8a0000;
            --card-h: clamp(90px, 18dvh, 150px);
            --card-w: calc(var(--card-h) * 0.72);
        }
        
        body {
            background: #000;
            color: white;
            font-family: 'Courier New', monospace;
            margin: 0;
            overflow: hidden;
            height: 100dvh;
            /* Anti-Select/Touch-Callout Lock */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* Persistent Background Animation */
        #nexus-bg { position: fixed; inset: 0; z-index: -1; opacity: 0.4; pointer-events: none; }
        #nexus-bg video { width: 100%; height: 100%; object-fit: cover; }

        /* Game Layout */
        #main-ui { display: flex; flex-direction: column; height: 100vh; }
        .title {
            text-align: center;
            color: var(--blood-glow);
            font-size: 2rem;
            padding: 20px;
            letter-spacing: 12px;
            text-shadow: 0 0 20px var(--blood-dark);
        }

        /* 3D Game Board */
        #game-board {
            flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
            padding: 20px; justify-items: center; align-content: center;
            perspective: 1200px;
        }

        .card-placeholder {
            width: var(--card-w); height: var(--card-h);
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 51, 51, 0.1);
            border-radius: 6px; position: relative;
        }

        /* Card Entities & Animations */
        .card-entity {
            position: fixed; width: var(--card-w); height: var(--card-h);
            transform-style: preserve-3d; z-index: 1000; cursor: pointer;
        }

        .card-inner {
            width: 100%; height: 100%; transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 6px; border: 1px solid rgba(138, 0, 0, 0.6);
            background: #050505; box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .card-entity.active .card-inner { transform: rotateY(180deg); }

        .back, .front {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 6px; overflow: hidden;
        }

        .back { transform: rotateY(0deg); }
        .front { 
            transform: rotateY(180deg); background-size: cover; background-position: center; 
        }

        /* CRT Overlay for High-Level Feel */
        .front::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        .back video { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }

        .matched { animation: fadeBack 0.8s forwards; pointer-events: none; }
        @keyframes fadeBack { to { opacity: 0; transform: scale(0.5) translateZ(-500px); } }

        /* --- Bottom Row Layout --- */
        #bottom-controls {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 0 30px 70px 30px; box-sizing: border-box; z-index: 2000;
        }

        .holo-blue-btn {
            background: rgba(0, 242, 255, 0.15); border: 1px solid #00f2ff; color: #00f2ff;
            padding: 12px 24px; text-decoration: none; font-weight: bold; letter-spacing: 2px;
            border-radius: 8px; backdrop-filter: blur(5px); box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
            transition: all 0.3s; text-align: center; font-size: 0.8rem; text-transform: uppercase;
        }
        .holo-blue-btn:hover { background: #00f2ff; color: #000; box-shadow: 0 0 25px #00f2ff; }

        #deck-frame {
            width: 55px; height: 75px; flex-shrink: 0;
            border: 2px solid var(--blood-glow); border-radius: 4px; background: rgba(138, 0, 0, 0.2);
            cursor: pointer; box-shadow: 0 0 15px var(--blood-dark); transition: all 0.3s;
        }
        #deck-frame:hover { box-shadow: 0 0 25px var(--blood-glow); transform: scale(1.08); }

        /* --- Holoframe Leaderboard Styles --- */
        #leaderboard-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5000;
        }

        .holoframe {
            width: 90%; max-width: 600px; background: rgba(40, 0, 0, 0.2); backdrop-filter: blur(15px);
            border: 1px solid var(--blood-glow); border-radius: 20px; padding: 20px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2), inset 0 0 15px rgba(255, 0, 0, 0.3);
            position: relative; overflow: hidden;
        }

        .holoframe::before {
            content: ''; position: absolute; top: -50px; left: 50%; transform: translateX(-50%);
            width: 200px; height: 100px; background: var(--blood-glow); filter: blur(80px); opacity: 0.4; z-index: -1;
        }

        #leaderboard-title { color: var(--blood-glow); text-align: center; letter-spacing: 10px; margin-bottom: 5px; cursor: pointer; user-select: none; transition: 0.3s; }
        #leaderboard-title:hover { text-shadow: 0 0 15px var(--blood-glow); }

        .leaderboard-table { width: 100%; border-collapse: collapse; color: #ffcccc; text-align: left; }
        .leaderboard-table th { border-bottom: 1px solid var(--blood-dark); padding: 10px; font-size: 0.8rem; letter-spacing: 2px; color: var(--blood-glow); }
        .leaderboard-table td { padding: 12px 10px; border-bottom: 1px solid rgba(138, 0, 0, 0.2); font-size: 0.9rem; }

        .scroll-area { max-height: 400px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--blood-dark) transparent; }

        .restart-strip { margin-top: 20px; width: 100%; text-align: center; border-top: 1px solid var(--blood-dark); padding-top: 15px; }
        .restart-btn { background: transparent; color: white; border: 1px solid var(--blood-glow); padding: 10px 30px; cursor: pointer; letter-spacing: 5px; transition: 0.3s; }
        .restart-btn:hover { background: var(--blood-glow); box-shadow: 0 0 20px var(--blood-glow); }

        /* --- Easter Egg: Rune Codex --- */
        #rune-codex {
            position: fixed; inset: 0; z-index: 6000; background: rgba(0,0,0,0.92); display: none;
            flex-direction: column; align-items: center; justify-content: center; color: var(--blood-glow); padding: 20px; overflow-y: auto;
        }
        #rune-codex.show { display: flex; }
        .rune-entry { display: flex; align-items: center; margin: 15px 0; width: 90%; max-width: 700px; padding: 15px; border: 1px solid rgba(255,51,51,0.3); border-radius: 8px; background: rgba(138,0,0,0.08); }
        .rune-symbol { font-size: 4rem; margin-right: 20px; min-width: 80px; text-align: center; text-shadow: 0 0 20px var(--blood-glow); font-family: 'Noto Sans Runic', sans-serif; }
        .rune-info { flex: 1; }
        .rune-name { font-size: 1.4rem; margin-bottom: 5px; }
        .rune-desc { font-size: 1rem; opacity: 0.9; }
        #codex-close { position: absolute; top: 20px; right: 30px; font-size: 2rem; cursor: pointer; color: var(--blood-glow); background: transparent; border: none; }

        /* Multiverse Tracker CSS Integration */
        .cyber-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; text-align: center; padding: 12px 0;
            background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(4px);
            border-top: 1px solid rgba(0, 255, 255, 0.15); z-index: 9999;
            font-family: 'Courier New', Courier, monospace; pointer-events: none;
        }
        .visit-count {
            color: #00ffff; font-size: 0.75rem; font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.8), 0 0 15px rgba(0, 255, 255, 0.4);
            letter-spacing: 1.5px; text-transform: uppercase; pointer-events: auto;
        }
        .loading { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Runic&display=swap">
</head>
<body>
    <div id="nexus-bg">
        <video autoplay muted loop playsinline>
            <source src="https://j3oblrqjmsss4ayx.public.blob.vercel-storage.com/nexus_render%20%288%29.webm" type="video/webm">
        </video>
    </div>

    <div id="main-ui">
        <div class="title">STARBLOOD</div>
        <div id="game-board"></div>
        <div id="bottom-controls">
            <a href="https://hermes-landing-nu.vercel.app" target="_blank" class="holo-blue-btn">HERMES MALL</a>
            <div id="deck-frame" onclick="app.deploy()"></div>
        </div>
    </div>

    <div id="leaderboard-overlay">
        <div class="holoframe">
            <h1 id="leaderboard-title">SYNC COMPLETE</h1>
            <p style="text-align: center; letter-spacing: 5px; color: white; margin-bottom: 20px; font-size: 0.8rem;">NEURAL LINK TERMINATED</p>
            
            <div class="scroll-area">
                <table class="leaderboard-table">
                    <thead><tr><th>#</th><th>Username</th><th>Flips</th><th>Date</th></tr></thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>

            <div class="restart-strip">
                <button class="restart-btn" onclick="app.reset()">RESTART</button>
            </div>
        </div>
    </div>

    <div id="rune-codex">
        <button id="codex-close" onclick="closeCodex()">×</button>
        <h1 style="color: var(--blood-glow); margin-bottom: 30px; letter-spacing: 8px;">RUNE CODEX</h1>
        <div id="rune-entries"></div>
    </div>

    <footer class="cyber-footer">
        <div class="visit-count" id="counter-display">
            UPLINK ESTABLISHING <span class="loading">...</span>
        </div>
    </footer>

    <script>
        // Precision paths synced perfectly to your /images/ folder and .jpeg files
        const faceFiles = [
            "images/IMG_0355.jpeg",
            "images/IMG_0356.jpeg",
            "images/IMG_0357.jpeg",
            "images/IMG_0358.jpeg",
            "images/IMG_0359.jpeg",
            "images/IMG_0360.jpeg",
            "images/IMG_0361.jpeg",
            "images/IMG_0362.jpeg",
            "images/IMG_0363.jpeg",
            "images/IMG_0364.jpeg"
        ];

        const runesData = [
            { rune: 'ᚠ', name: 'Fehu', meaning: 'Wealth, abundance, success, prosperity, new beginnings' },
            { rune: 'ᚢ', name: 'Uruz', meaning: 'Strength, vitality, health, endurance, raw power' },
            { rune: 'ᚦ', name: 'Thurisaz', meaning: 'Protection, defense, conflict, breakthrough, giant force' },
            { rune: 'ᚨ', name: 'Ansuz', meaning: 'Communication, wisdom, inspiration, divine breath, signals' },
            { rune: 'ᚱ', name: 'Raido', meaning: 'Journey, travel, rhythm, progress, wagon path' },
            { rune: 'ᚲ', name: 'Kenaz', meaning: 'Torch, knowledge, creativity, illumination, craft' },
            { rune: 'ᚷ', name: 'Gebo', meaning: 'Gift, partnership, exchange, balance, generosity' },
            { rune: 'ᚹ', name: 'Wunjo', meaning: 'Joy, harmony, bliss, fellowship, achievement' },
            { rune: 'ᚺ', name: 'Hagalaz', meaning: 'Hail, disruption, transformation, natural forces, crisis' },
            { rune: 'ᚾ', name: 'Naudiz', meaning: 'Need, constraint, endurance, resistance, self-reliance' }
        ];

        const cardVideo = "https://j3oblrqjmsss4ayx.public.blob.vercel-storage.com/Videoleap_2026_01_20_18_07_56_976.mp4";

        const app = {
            selected: [], matches: 0, flips: 0,
            init() {
                this.initBoard();
                this.loadLeaderboard();
                this.setupEasterEgg();
                this.populateCodex();
            },
            initBoard() {
                const board = document.getElementById('game-board');
                board.innerHTML = '';
                for(let i=0; i<20; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'card-placeholder';
                    slot.id = `slot-${i}`;
                    board.appendChild(slot);
                }
            },
            deploy() {
                if (document.querySelector('.card-entity')) return;
                
                this.flips = 0;
                this.matches = 0;
                this.selected = [];

                // Create the paired deck (10 unique images x 2 = 20 cards)
                let deck = [...faceFiles, ...faceFiles];

                // TRUE RANDOMIZATION: Fisher-Yates algorithm thoroughly shuffles the deck
                for (let i = deck.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [deck[i], deck[j]] = [deck[j], deck[i]];
                }

                const deckFrame = document.getElementById('deck-frame');
                const deckRect = deckFrame.getBoundingClientRect();

                deck.forEach((path, i) => {
                    const card = document.createElement('div');
                    card.className = 'card-entity';
                    card.dataset.val = path;
                    
                    card.innerHTML = `
                        <div class="card-inner">
                            <div class="back"><video autoplay muted loop playsinline><source src="${cardVideo}"></video></div>
                            <div class="front" style="background-image:url('${path}')"></div>
                        </div>
                    `;

                    card.style.left = deckRect.left + 'px';
                    card.style.top = deckRect.top + 'px';
                    card.style.transform = "scale(0.3)";
                    document.body.appendChild(card);

                    const slot = document.getElementById(`slot-${i}`);
                    const slotRect = slot.getBoundingClientRect();

                    setTimeout(() => {
                        card.style.transition = "all 0.7s cubic-bezier(0.25, 1, 0.5, 1)";
                        card.style.left = slotRect.left + 'px';
                        card.style.top = slotRect.top + 'px';
                        card.style.transform = "scale(1)";
                        
                        setTimeout(() => {
                            card.style.position = "relative";
                            card.style.left = "0";
                            card.style.top = "0";
                            slot.appendChild(card);
                            card.onclick = () => this.flip(card);
                        }, 700);
                    }, i * 40);
                });
            },
            flip(card) {
                if (this.selected.length >= 2 || card.classList.contains('active') || card.classList.contains('matched')) return;
                
                card.classList.add('active');
                this.selected.push(card);
                this.flips++;
                
                if (this.selected.length === 2) {
                    setTimeout(() => this.checkMatch(), 1000); 
                }
            },
            checkMatch() {
                const [a, b] = this.selected;
                
                if (a.dataset.val === b.dataset.val) {
                    a.classList.add('matched');
                    b.classList.add('matched');
                    this.matches++;
                    
                    // PHYSICALLY REMOVE FROM BOARD: Hide the cards entirely after fade animation
                    setTimeout(() => {
                        a.style.display = 'none';
                        b.style.display = 'none';
                    }, 800);

                    // Win condition
                    if (this.matches === 10) setTimeout(() => this.showWinScreen(), 1000);
                } else {
                    a.classList.remove('active');
                    b.classList.remove('active');
                }
                
                this.selected = [];
            },
            showWinScreen() {
                const username = prompt('Enter your username for the leaderboard:') || 'Anonymous';
                const date = new Date().toLocaleDateString();
                this.saveToLeaderboard(username, this.flips, date);
                this.displayLeaderboard();
                
                const overlay = document.getElementById('leaderboard-overlay');
                overlay.style.display = 'flex';
            },
            saveToLeaderboard(username, flips, date) {
                let lb = JSON.parse(localStorage.getItem('starbloodLB')) || [];
                lb.push({ username, flips, date });
                lb.sort((a,b) => a.flips - b.flips);
                if (lb.length > 10) lb.length = 10;
                localStorage.setItem('starbloodLB', JSON.stringify(lb));
            },
            displayLeaderboard() {
                const body = document.getElementById('leaderboard-body');
                body.innerHTML = '';
                const lb = JSON.parse(localStorage.getItem('starbloodLB')) || [];
                lb.forEach((e, i) => {
                    body.innerHTML += `<tr><td>${i+1}</td><td>${e.username}</td><td>${e.flips}</td><td>${e.date}</td></tr>`;
                });
            },
            loadLeaderboard() {
                this.displayLeaderboard();
            },
            reset() {
                const overlay = document.getElementById('leaderboard-overlay');
                overlay.style.display = 'none';
                this.initBoard();
                this.deploy();
            },
            setupEasterEgg() {
                const title = document.getElementById('leaderboard-title');
                let clicks = 0;
                let timeout;
                title.addEventListener('click', () => {
                    clicks++;
                    clearTimeout(timeout);
                    timeout = setTimeout(() => { clicks = 0; }, 800);
                    if (clicks === 3) {
                        document.getElementById('rune-codex').classList.add('show');
                        clicks = 0;
                    }
                });
            },
            populateCodex() {
                const container = document.getElementById('rune-entries');
                runesData.forEach(r => {
                    const entry = document.createElement('div');
                    entry.className = 'rune-entry';
                    entry.innerHTML = `
                        <div class="rune-symbol">${r.rune}</div>
                        <div class="rune-info">
                            <div class="rune-name">${r.name}</div>
                            <div class="rune-desc">${r.meaning}</div>
                        </div>
                    `;
                    container.appendChild(entry);
                });
            }
        };

        function closeCodex() {
            document.getElementById('rune-codex').classList.remove('show');
        }

        // ==========================================
        // MULTIVERSE TRACKER LOGIC
        // ==========================================
        const supabaseUrl = 'https://ezfwzqxwafvdjtwnmyrx.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6Znd6cXh3YWZ2ZGp0d25teXJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwOTA2NzIsImV4cCI6MjA5NzY2NjY3Mn0.baxnDWZ9rSZobzqnAOND7SuJpXbl4wmRyUYTQl4whPE';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

        function getSafeVisitorId() {
            let id = localStorage.getItem('nexus_visitor_id');
            if (!id) {
                if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                    id = crypto.randomUUID();
                } else {
                    id = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                        const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                        return v.toString(16);
                    });
                }
                localStorage.setItem('nexus_visitor_id', id);
            }
            return id;
        }

        async function updateMultiverseCount(isInitialLoad = false) {
            const displayElement = document.getElementById('counter-display');
            try {
                const visitorId = getSafeVisitorId();

                if (isInitialLoad) {
                    await supabaseClient.rpc('track_ping', { p_ip_hash: visitorId });
                    await new Promise(resolve => setTimeout(resolve, 500));
                }

                const { data: globalData } = await supabaseClient.from('global_stats').select('total_pings').single();
                const { count: uniqueCount } = await supabaseClient.from('unique_visitors').select('*', { count: 'exact', head: true });

                const total = globalData ? globalData.total_pings : 0;
                const unique = uniqueCount !== null ? uniqueCount : 0;
                
                displayElement.innerHTML = `
                    UNIQUE TRAVERSALS: [ <span style="color: #ff00ff; text-shadow: 0 0 10px #ff00ff;">${unique}</span> ] 
                    <span style="opacity: 0.5; margin: 0 10px;">///</span> 
                    TOTAL PINGS: [ <span style="color: #00ffff;">${total}</span> ]
                `;
                displayElement.classList.remove('loading');

            } catch (error) {
                console.error('Uplink failed:', error);
                displayElement.innerHTML = `MULTIVERSE NODE: [ <span style="color: #ff3366;">OFFLINE</span> ]`;
                displayElement.classList.remove('loading');
            }
        }

        window.addEventListener('load', () => {
            app.init();
            updateMultiverseCount(true);
            setInterval(() => updateMultiverseCount(false), 60000);
        });
    </script>
</body>
</html>
