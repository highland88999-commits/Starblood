<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>S T A R B L O O D</title>
    <style>
        :root {
            --blood-glow: #ff3333;
            --blood-dark: #8a0000;
            --card-h: clamp(90px, 18dvh, 150px);
            --card-w: calc(var(--card-h) * 0.72);
        }
        
        body {
            background: #000;
            color: white;
            font-family: 'Courier New', monospace;
            margin: 0;
            overflow: hidden;
            height: 100dvh;
        }

        /* Persistent Background Animation */
        #nexus-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.4;
            pointer-events: none;
        }
        #nexus-bg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Game Layout */
        #main-ui {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .title {
            text-align: center;
            color: var(--blood-glow);
            font-size: 2rem;
            padding: 20px;
            letter-spacing: 12px;
            text-shadow: 0 0 20px var(--blood-dark);
        }

        /* 3D Game Board */
        #game-board {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 20px;
            justify-items: center;
            align-content: center;
            perspective: 1200px; /* High-level depth */
        }

        .card-placeholder {
            width: var(--card-w);
            height: var(--card-h);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 51, 51, 0.1);
            border-radius: 6px;
            position: relative;
        }

        /* Card Entities & Animations */
        .card-entity {
            position: fixed;
            width: var(--card-w);
            height: var(--card-h);
            transform-style: preserve-3d;
            z-index: 1000;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 6px;
            border: 1px solid rgba(138, 0, 0, 0.6);
            background: #050505;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .card-entity.active .card-inner {
            transform: rotateY(180deg);
        }

        .back, .front {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 6px;
            overflow: hidden;
        }

        .back { transform: rotateY(0deg); }
        .front { 
            transform: rotateY(180deg); 
            background-size: cover;
            background-position: center;
        }

        /* CRT Overlay for High-Level Feel */
        .front::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .back video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }

        .matched {
            animation: fadeBack 0.8s forwards;
            pointer-events: none;
        }

        @keyframes fadeBack {
            to { opacity: 0; transform: scale(0.5) translateZ(-500px); }
        }

        #deck-frame {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 55px;
            height: 75px;
            border: 2px solid var(--blood-glow);
            border-radius: 4px;
            background: rgba(138, 0, 0, 0.2);
            z-index: 2000;
            cursor: pointer;
            box-shadow: 0 0 15px var(--blood-dark);
            transition: all 0.3s;
        }
        
        #deck-frame:hover {
            box-shadow: 0 0 25px var(--blood-glow);
            transform: scale(1.08);
        }

        /* --- Holoframe Leaderboard Styles --- */
        #leaderboard-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5000;
        }

        .holoframe {
            width: 90%;
            max-width: 600px;
            background: rgba(40, 0, 0, 0.2);
            backdrop-filter: blur(15px);
            border: 1px solid var(--blood-glow);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2), inset 0 0 15px rgba(255, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* The "Bloom Orb" Decoration */
        .holoframe::before {
            content: '';
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 100px;
            background: var(--blood-glow);
            filter: blur(80px);
            opacity: 0.4;
            z-index: -1;
        }

        #leaderboard-title { 
            color: var(--blood-glow); 
            text-align: center; 
            letter-spacing: 10px; 
            margin-bottom: 5px;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            color: #ffcccc;
            text-align: left;
        }

        .leaderboard-table th {
            border-bottom: 1px solid var(--blood-dark);
            padding: 10px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--blood-glow);
        }

        .leaderboard-table td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(138, 0, 0, 0.2);
            font-size: 0.9rem;
        }

        .scroll-area {
            max-height: 400px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--blood-dark) transparent;
        }

        /* Restart Strip */
        .restart-strip {
            margin-top: 20px;
            width: 100%;
            text-align: center;
            border-top: 1px solid var(--blood-dark);
            padding-top: 15px;
        }

        .restart-btn {
            background: transparent;
            color: white;
            border: 1px solid var(--blood-glow);
            padding: 10px 30px;
            cursor: pointer;
            letter-spacing: 5px;
            transition: 0.3s;
        }

        .restart-btn:hover {
            background: var(--blood-glow);
            box-shadow: 0 0 20px var(--blood-glow);
        }
    </style>
</head>
<body>
    <div id="nexus-bg">
        <video autoplay muted loop playsinline>
            <source src="https://j3oblrqjmsss4ayx.public.blob.vercel-storage.com/nexus_render%20%288%29.webm" type="video/webm">
        </video>
    </div>

    <div id="main-ui">
        <div class="title">STARBLOOD</div>
        <div id="game-board"></div>
        <div id="deck-frame" onclick="app.deploy()"></div>
    </div>

    <div id="leaderboard-overlay">
        <div class="holoframe">
            <h1 id="leaderboard-title">SYNC COMPLETE</h1>
            <p style="text-align: center; letter-spacing: 5px; color: white; margin-bottom: 20px; font-size: 0.8rem;">NEURAL LINK TERMINATED</p>
            
            <div class="scroll-area">
                <table class="leaderboard-table">
                    <thead><tr><th>#</th><th>Username</th><th>Flips</th><th>Date</th></tr></thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>

            <div class="restart-strip">
                <button class="restart-btn" onclick="app.reset()">RESTART</button>
            </div>
        </div>
    </div>

    <script>
        // High-precision file list directly matching your /public/images/ folder hashes
        const faceFiles = [
            "/images/Screenshot_2026-01-20-15-02-24-76_680d03679600f7af0b4c700c6b270fe7.jpg",
            "/images/Screenshot_2026-01-20-15-05-56-58_680d03679600f7af0b4c700c6b270fe7.jpg",
            "/images/Screenshot_2026-01-20-15-06-24-65_680d03679600f7af0b4c700c6b270fe7.jpg",
            "/images/Screenshot_2026-01-20-15-06-39-34_680d03679600f7af0b4c700c6b270fe7.jpg",
            "/images/Screenshot_2026-01-20-15-07-31-75_680d03679600f7af0b4c700c6b270fe7.jpg",
            "/images/Screenshot_2026-01-20-15-09-18-64_680d03679600f7af0b4c700c6b270fe7.jpg",
            "/images/Screenshot_2026-01-20-15-09-46-94_680d03679600f7af0b4c700c6b270fe7.jpg",
            "/images/Screenshot_2026-01-20-15-09-59-72_680d03679600f7af0b4c700c6b270fe7.jpg",
            "/images/Screenshot_2026-01-20-15-10-12-71_680d03679600f7af0b4c700c6b270fe7.jpg",
            "/images/Screenshot_2026-01-20-15-10-25-20_680d03679600f7af0b4c700c6b270fe7.jpg"
        ];

        // Card back video
        const cardVideo = "https://j3oblrqjmsss4ayx.public.blob.vercel-storage.com/Videoleap_2026_01_20_18_07_56_976.mp4";

        const app = {
            selected: [],
            matches: 0,
            flips: 0,
            init() {
                this.initBoard();
                this.loadLeaderboard();
            },
            initBoard() {
                const board = document.getElementById('game-board');
                board.innerHTML = '';
                for(let i=0; i<20; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'card-placeholder';
                    slot.id = `slot-${i}`;
                    board.appendChild(slot);
                }
            },
            deploy() {
                if (document.querySelector('.card-entity')) return;
                
                this.flips = 0;
                this.matches = 0;
                this.selected = [];

                // Duplicate the 10 images to make 20 pairs, then shuffle
                const deck = [...faceFiles, ...faceFiles].sort(() => Math.random() - 0.5);
                const deckFrame = document.getElementById('deck-frame');
                const deckRect = deckFrame.getBoundingClientRect();

                deck.forEach((path, i) => {
                    const card = document.createElement('div');
                    card.className = 'card-entity';
                    card.dataset.val = path;
                    
                    card.innerHTML = `
                        <div class="card-inner">
                            <div class="back"><video autoplay muted loop playsinline><source src="${cardVideo}"></video></div>
                            <div class="front" style="background-image:url('${path}')"></div>
                        </div>
                    `;

                    // Deal from deck position
                    card.style.left = deckRect.left + 'px';
                    card.style.top = deckRect.top + 'px';
                    card.style.transform = "scale(0.3)";
                    document.body.appendChild(card);

                    const slot = document.getElementById(`slot-${i}`);
                    const slotRect = slot.getBoundingClientRect();

                    // Animate to destination grid
                    setTimeout(() => {
                        card.style.transition = "all 0.7s cubic-bezier(0.25, 1, 0.5, 1)";
                        card.style.left = slotRect.left + 'px';
                        card.style.top = slotRect.top + 'px';
                        card.style.transform = "scale(1)";
                        
                        setTimeout(() => {
                            card.style.position = "relative";
                            card.style.left = "0";
                            card.style.top = "0";
                            slot.appendChild(card);
                            card.onclick = () => this.flip(card);
                        }, 700);
                    }, i * 40);
                });
            },
            flip(card) {
                if (this.selected.length >= 2 || card.classList.contains('active') || card.classList.contains('matched')) return;
                card.classList.add('active');
                this.selected.push(card);
                this.flips++;
                if (this.selected.length === 2) setTimeout(() => this.checkMatch(), 800);
            },
            checkMatch() {
                const [a, b] = this.selected;
                if (a.dataset.val === b.dataset.val) {
                    a.classList.add('matched');
                    b.classList.add('matched');
                    this.matches++;
                    if (this.matches === 10) setTimeout(() => this.showWinScreen(), 800);
                } else {
                    a.classList.remove('active');
                    b.classList.remove('active');
                }
                this.selected = [];
            },
            showWinScreen() {
                const username = prompt('Enter your username for the leaderboard:') || 'Anonymous';
                const date = new Date().toLocaleDateString();
                this.saveToLeaderboard(username, this.flips, date);
                this.displayLeaderboard();
                
                const overlay = document.getElementById('leaderboard-overlay');
                overlay.style.display = 'flex';
            },
            saveToLeaderboard(username, flips, date) {
                let lb = JSON.parse(localStorage.getItem('starbloodLB')) || [];
                lb.push({ username, flips, date });
                lb.sort((a,b) => a.flips - b.flips);
                if (lb.length > 10) lb.length = 10; // Keep top 10
                localStorage.setItem('starbloodLB', JSON.stringify(lb));
            },
            displayLeaderboard() {
                const body = document.getElementById('leaderboard-body');
                body.innerHTML = '';
                const lb = JSON.parse(localStorage.getItem('starbloodLB')) || [];
                lb.forEach((e, i) => {
                    body.innerHTML += `<tr><td>${i+1}</td><td>${e.username}</td><td>${e.flips}</td><td>${e.date}</td></tr>`;
                });
            },
            loadLeaderboard() {
                this.displayLeaderboard();
            },
            reset() {
                const overlay = document.getElementById('leaderboard-overlay');
                overlay.style.display = 'none';
                this.initBoard();
                this.deploy();
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
